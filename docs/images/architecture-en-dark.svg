<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 604" width="1200" height="604" role="img" aria-labelledby="title desc" lang="en">
<title id="title">The database decides who sees what. Code checks every source.</title>
<desc id="desc">How Daidai works. A newcomer's question reaches the Daidai server. The database searches with the viewer's permissions and returns only notes the viewer may read. Claude writes a draft from those notes alone, and Daidai's code checks the source of every sentence before the cited answer goes back. If nobody knows, the question reaches last year's holder, who answers by voice and publishes, and the signed answer reaches the newcomer. Documents and chats are redacted on the device before they become draft notes.</desc>
