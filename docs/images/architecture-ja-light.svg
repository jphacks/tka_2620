<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 604" width="1200" height="604" role="img" aria-labelledby="title desc" lang="ja">
<title id="title">見せる範囲はデータベースが、出典はコードが確かめる</title>
<desc id="desc">代々のしくみ。後輩の質問は代々のサーバーに届き、データベースが見る人の権限で検索して、読めるメモだけを返す。Claude はそのメモだけから下書きを書き、代々のコードが文ごとに出典を確かめて、出典つきの答えを返す。誰も知らなければ、質問は去年の担当者に届き、声で答えて公開すると、署名つきの答えが後輩に届く。資料とトーク履歴は端末の中で黒塗りしてからメモの下書きになる。</desc>
